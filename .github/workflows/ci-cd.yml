name: CI-CD with SonarQube

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm test
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/lcov.info

  sonarqube-analysis:
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: coverage
          path: coverage

      - name: SonarQube Cloud Scan
        uses: SonarSource/sonarqube-scan-action@v5.0.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=jan-1103
            -Dsonar.projectKey=jan-1103_sonar-cicd-project
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=300

  deploy:
    needs: sonarqube-analysis
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and deploy container
        run: |
          docker build -t devops-sonar-demo:${{ github.sha }} .
          docker rm -f demo-app || true
          docker run -d --name demo-app -p 3000:3000 devops-sonar-demo:${{ github.sha }}
