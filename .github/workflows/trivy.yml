name: CI/CD with Trivy

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-scan:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            context: .
          - name: frontend
            context: ./frontend
    steps:
      - uses: actions/checkout@v4

      - name: Build ${{ matrix.name }} image
        run: docker build -t devops-${{ matrix.name }}:${{ github.run_number }} ${{ matrix.context }}

      - name: Trivy report (HIGH and CRITICAL)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: devops-${{ matrix.name }}:${{ github.run_number }}
          scanners: vuln
          format: table
          severity: HIGH,CRITICAL
          output: ${{ matrix.name }}-report.txt
          exit-code: '0'

      - name: Show report in summary
        if: always()
        run: |
          echo "### ${{ matrix.name }} Trivy report" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat ${{ matrix.name }}-report.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-${{ matrix.name }}-report
          path: ${{ matrix.name }}-report.txt

      - name: Trivy gate (fail on CRITICAL)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: devops-${{ matrix.name }}:${{ github.run_number }}
          scanners: vuln
          severity: CRITICAL
          exit-code: '1'

  deploy:
    needs: build-and-scan
    runs-on: ubuntu-latest
    steps:
      - run: echo "Trivy passed - deploying..."
