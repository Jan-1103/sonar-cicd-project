name: CI/CD with Trivy

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-scan:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            context: .
          - name: frontend
            context: ./frontend
    env:
      IMAGE: devops-${{ matrix.name }}:${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - name: Build ${{ matrix.name }} image
        run: docker build -t $IMAGE ${{ matrix.context }}

      - name: Trivy report (HIGH and CRITICAL)
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v $PWD:/work \
            aquasec/trivy:latest image \
            --scanners vuln --severity HIGH,CRITICAL \
            --format table --output /work/${{ matrix.name }}-report.txt \
            $IMAGE

      - name: Show report in summary
        if: always()
        run: |
          echo "### ${{ matrix.name }} Trivy report" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat ${{ matrix.name }}-report.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-${{ matrix.name }}-report
          path: ${{ matrix.name }}-report.txt

      - name: Trivy gate (fail on CRITICAL)
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:latest image \
            --scanners vuln --severity CRITICAL \
            --exit-code 1 \
            $IMAGE

  deploy:
    needs: build-and-scan
    runs-on: ubuntu-latest
    steps:
      - run: echo "Trivy passed - deploying..."
